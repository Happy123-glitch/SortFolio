services:
  - type: web
    name: sortfolio-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0

  - type: web
    name: sortfolio-frontend
    env: static
    buildCommand: ""
    staticPublishPath: ./
